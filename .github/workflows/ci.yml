name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Run by hand (Actions → CI → Run workflow) to score the agents against real Claude.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, unit and contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: No references to the legacy platform
        run: pnpm check:forbidden
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  integration:
    name: Integration tests (Testcontainers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:int
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-coverage
          path: coverage/integration/
          retention-days: 7

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://teacherhub:teacherhub@localhost:5432/teacherhub
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: teacherhub
          POSTGRES_PASSWORD: teacherhub
          POSTGRES_DB: teacherhub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U teacherhub" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @thp/web exec playwright install --with-deps chromium
      - run: pnpm db:migrate
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  e2e-stripe:
    name: E2E against Stripe test mode
    runs-on: ubuntu-latest
    env:
      RAW_STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      DATABASE_URL: postgres://teacherhub:teacherhub@localhost:5432/teacherhub
      APP_URL: http://localhost:3000
      APP_ENV: test
      BILLING_PROVIDER: stripe
      GOOGLE_AUTH_PROVIDER: local
      LOCAL_GOOGLE_SECRET: ci-local-google-secret
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: teacherhub
          POSTGRES_PASSWORD: teacherhub
          POSTGRES_DB: teacherhub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U teacherhub" --health-interval 5s --health-retries 10
    steps:
      - name: Require a Stripe test-mode key
        # Strips whitespace pasted along with the secret, then exports the cleaned key. On a wrong
        # kind of key it names only the non-secret prefix (e.g. pk_test_ or sk_live_).
        run: |
          key="$(printf '%s' "$RAW_STRIPE_SECRET_KEY" | tr -d '[:space:]')"
          if [ -z "$key" ]; then
            echo "::error::Add the STRIPE_SECRET_KEY repository secret (a sk_test_ key). See README, Billing."
            exit 1
          fi
          case "$key" in
            sk_test_*|rk_test_*)
              echo "::add-mask::$key"
              echo "STRIPE_SECRET_KEY=$key" >> "$GITHUB_ENV"
              exit 0
              ;;
          esac
          kind="$(printf '%s' "$key" | grep -oE '^(sk|pk|rk)_(test|live)_' || true)"
          echo "::error::STRIPE_SECRET_KEY must be a test-mode secret key starting with sk_test_. The secret holds ${kind:-a value in an unrecognised format}${kind:+ key}."
          exit 1
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @thp/web exec playwright install --with-deps chromium
      - name: Install the Stripe CLI
        run: |
          curl -s https://packages.stripe.dev/api/security/keypair/stripe-cli-gpg/public | gpg --dearmor | sudo tee /usr/share/keyrings/stripe.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/stripe.gpg] https://packages.stripe.dev/stripe-cli-debian-local stable main" | sudo tee /etc/apt/sources.list.d/stripe.list
          sudo apt-get update && sudo apt-get install -y stripe
      - run: pnpm stripe:setup
      - run: pnpm db:migrate
      - name: Forward Stripe webhooks to the app
        run: |
          webhook_secret="$(stripe listen --api-key "$STRIPE_SECRET_KEY" --print-secret)"
          echo "::add-mask::$webhook_secret"
          echo "STRIPE_WEBHOOK_SECRET=$webhook_secret" >> "$GITHUB_ENV"
          nohup stripe listen --api-key "$STRIPE_SECRET_KEY" --events customer.subscription.created,customer.subscription.updated,customer.subscription.deleted --forward-to localhost:3000/api/billing/webhook > stripe-listen.log 2>&1 &
      - name: Build and start the web app
        run: |
          pnpm --filter @thp/web build
          nohup pnpm --filter @thp/web start > web.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:3000/api/health && exit 0; sleep 2; done
          cat web.log; exit 1
      - run: pnpm test:e2e:stripe
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-stripe-report
          path: |
            apps/web/playwright-report/
            web.log
            stripe-listen.log
          retention-days: 7

  evals:
    name: LLM evals (planner, assistant, presentations)
    runs-on: ubuntu-latest
    # Calls Claude, which costs money: only when run by hand, and only once the key is set.
    # Every push already scores the saved replies in evals/replays (part of the unit tests).
    if: github.event_name == 'workflow_dispatch'
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - name: Skip without an Anthropic key
        if: env.ANTHROPIC_API_KEY == ''
        run: echo "::notice::Add the ANTHROPIC_API_KEY repository secret to run the evals. See README, Lesson planner."
      - uses: actions/checkout@v4
        if: env.ANTHROPIC_API_KEY != ''
      - uses: pnpm/action-setup@v4
        if: env.ANTHROPIC_API_KEY != ''
      - uses: actions/setup-node@v4
        if: env.ANTHROPIC_API_KEY != ''
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: env.ANTHROPIC_API_KEY != ''
      - run: pnpm eval
        if: env.ANTHROPIC_API_KEY != ''
